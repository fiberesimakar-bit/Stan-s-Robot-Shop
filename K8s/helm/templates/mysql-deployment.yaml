
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    service: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      service: mysql
  template:
    metadata:
      labels:
        service: mysql
      annotations:
        checksum/mysql-config: {{ include (print $.Template.BasePath "/mysql-configmap.yaml") . | sha256sum }}
    spec:
      {{ if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{ end }}
      containers:
        - name: mysql
          image: {{ .Values.image.repo }}/rs-mysql-db:{{ .Values.image.version }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # added for Istio
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-config
              mountPath: /etc/mysql/conf.d/mysql-memory.cnf
              subPath: mysql-memory.cnf
              readOnly: true
          resources:
            limits:
              cpu: 1000m
              memory: 3Gi
            requests:
              cpu: 200m
              memory: 1Gi
      volumes:
        - name: mysql-config
          configMap:
            name: mysql-config
      restartPolicy: Always
      {{- with .Values.mysql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mysql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mysql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
