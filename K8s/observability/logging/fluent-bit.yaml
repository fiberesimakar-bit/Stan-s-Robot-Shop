apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: robot-shop-fluent-bit
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: robot-shop-fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: robot-shop-fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     1
        Daemon                    Off
        Log_Level                 info
        Parsers_File              parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_PORT                 2020

    [INPUT]
        Name                      tail
        Path                      /var/log/containers/*.log
        Parser                    cri
        Tag                       kube.*
        DB                        /fluent-bit/state/flb_kube.db
        DB.locking                true
        Mem_Buf_Limit             10MB
        Skip_Long_Lines           On
        Refresh_Interval          10
        Read_from_Head            Off

    [FILTER]
        Name                      kubernetes
        Match                     kube.*
        Kube_URL                  https://kubernetes.default.svc:443
        Kube_CA_File              /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File           /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log                 On
        Keep_Log                  On
        Labels                    On
        Annotations               Off

    [FILTER]
        Name                      lua
        Match                     kube.*
        Script                    /fluent-bit/etc/normalize.lua
        Call                      normalize_log

    [OUTPUT]
        Name                      loki
        Match                     kube.*
        Host                      loki.observability.svc.cluster.local
        Port                      3100
        Labels                    job=robot-shop,service=$service,level=$level,namespace=$kubernetes['namespace_name']
        Line_Format               json

  parsers.conf: |
    [PARSER]
        Name                      cri
        Format                    regex
        Regex                     ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key                  time
        Time_Format               %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep                 On

  normalize.lua: |
    local function normalize_level(value)
      if type(value) == "number" then
        if value >= 50 then return "critical" end
        if value >= 40 then return "error" end
        if value >= 30 then return "warning" end
        if value >= 20 then return "info" end
        return "debug"
      end
      if type(value) == "string" then
        local lower = string.lower(value)
        if string.find(lower, "fatal") or string.find(lower, "critical") then return "critical" end
        if string.find(lower, "error") or string.find(lower, "err") then return "error" end
        if string.find(lower, "warn") then return "warning" end
        if string.find(lower, "info") or string.find(lower, "notice") then return "info" end
        if string.find(lower, "debug") or string.find(lower, "trace") then return "debug" end
      end
      return nil
    end

    function normalize_log(tag, timestamp, record)
      local kubernetes = record["kubernetes"] or {}
      local pod_labels = kubernetes["labels"] or {}
      record["service"] = pod_labels["service"] or kubernetes["container_name"] or "unknown"

      local level = normalize_level(record["level"]) or normalize_level(record["severity"]) or normalize_level(record["log_level"])
      if not level then
        local message = tostring(record["message"] or record["log"] or "")
        level = normalize_level(message) or "unknown"
      end
      record["level"] = level
      return 1, timestamp, record
    end
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.2.10
          ports:
            - name: metrics
              containerPort: 2020
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          livenessProbe:
            httpGet:
              path: /
              port: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: positions
              mountPath: /fluent-bit/state
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: positions
          emptyDir: {}
