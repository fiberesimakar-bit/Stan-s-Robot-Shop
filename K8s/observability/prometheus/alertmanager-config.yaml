apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: robot-shop-slack
  namespace: monitoring
  labels:
    team: robot-shop
spec:
  route:
    receiver: robot-shop-slack
    groupBy:
      - alertname
      - service
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: alertname
        matchType: =~
        value: RobotShop.*
  receivers:
    - name: robot-shop-slack
      slackConfigs:
        - apiURL:
            name: robot-shop-slack
            key: slack_api_url
          channel: "#robot-shop-alerts"
          sendResolved: true
          title: '{{ template "slack.default.title" . }}'
          text: >-
            {{ range .Alerts }}{{ .Annotations.summary }}
            Service: {{ .Labels.service }}
            Runbook: {{ .Annotations.runbook_url }}
            {{ end }}
