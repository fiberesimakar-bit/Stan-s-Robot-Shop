prometheus:
  prometheusSpec:
    retention: 30d
    scrapeInterval: 30s
    evaluationInterval: 30s
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    additionalScrapeConfigs:
      - job_name: robot-shop-services
        metrics_path: /metrics
        static_configs:
          - targets:
              - cart.default.svc.cluster.local:8080
            labels:
              service: cart
              namespace: default
          - targets:
              - payment.default.svc.cluster.local:8080
            labels:
              service: payment
              namespace: default
      - job_name: robot-shop-web-probe
        metrics_path: /probe
        params:
          module:
            - http_2xx
        static_configs:
          - targets:
              - http://web.default.svc.cluster.local:8080/
        relabel_configs:
          - source_labels:
              - __address__
            target_label: __param_target
          - source_labels:
              - __param_target
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
          - target_label: service
            replacement: web

grafana:
  enabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      uid: loki
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false
      editable: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

alertmanager:
  alertmanagerSpec:
    alertmanagerConfigSelector:
      matchLabels:
        team: robot-shop
    alertmanagerConfigNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring

prometheusOperator:
  enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
